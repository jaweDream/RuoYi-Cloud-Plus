name: CI/CD Pipeline

on:
  push:
    branches: [ "dev-ops" ]
    paths:
      - 'ruoyi-**/**'
      - 'pom.xml'
      - '.docker/**'
      - 'Dockerfile'
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "dev-ops" ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      registry_type:
        description: '镜像仓库类型'
        required: false
        default: 'github'
        type: choice
        options:
          - github
          - dockerhub
          - custom
      custom_registry:
        description: '自定义镜像仓库URL'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: 构建与测试
        run: mvn -B package --file pom.xml -DskipTests=${{ github.event_name == 'push' && contains(github.ref, 'tags/v') && 'false' || 'true' }}

      - name: 缓存Maven包
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 打包制品
        if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "*/target/original-*.jar" -not -path "*/target/*-javadoc.jar" -not -path "*/target/*-sources.jar" -not -path "*/target/test-*" -not -path "*/target/classes" -not -path "*/target/maven-*" -exec cp {} artifacts/ \;

      - name: 上传构建制品
        if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          retention-days: 5

  prepare-modules:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: 设置要构建的模块
        id: set-modules
        run: |
          # 默认模块列表
          MODULES='["ruoyi-gateway","ruoyi-auth","ruoyi-system","ruoyi-gen","ruoyi-job","ruoyi-resource","ruoyi-workflow"]'
          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
          echo "将构建以下模块: ${MODULES}"

  docker-build:
    needs: [build, prepare-modules]
    if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.prepare-modules.outputs.modules) }}
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/

      # 直接在这个文件中处理Docker登录，无需嵌套工作流
      - name: 设置 Docker 登录信息
        id: login-vars
        run: |
          # 设置仓库类型变量
          if [ "${{ github.event.inputs.registry_type }}" == "github" ] || [ -z "${{ github.event.inputs.registry_type }}" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "registry_url=ghcr.io" >> $GITHUB_OUTPUT
            echo "image_prefix=ghcr.io/${OWNER}" >> $GITHUB_OUTPUT
            echo "username=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.registry_type }}" == "dockerhub" ]; then
            echo "registry_url=docker.io" >> $GITHUB_OUTPUT
            echo "image_prefix=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.DOCKERHUB_TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "registry_url=${{ github.event.inputs.custom_registry }}" >> $GITHUB_OUTPUT
            echo "image_prefix=${{ github.event.inputs.custom_registry }}/${{ secrets.CUSTOM_REGISTRY_USERNAME }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.CUSTOM_REGISTRY_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.CUSTOM_REGISTRY_TOKEN }}" >> $GITHUB_OUTPUT
          fi

      - name: 登录到 Docker 仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.login-vars.outputs.registry_url }}
          username: ${{ steps.login-vars.outputs.username }}
          password: ${{ steps.login-vars.outputs.password }}

      - name: 准备构建参数
        id: build-params
        run: |
          MODULE="${{ matrix.module }}"

          # 确定 Dockerfile 路径
          if [[ -f "./${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="./${MODULE}/Dockerfile"
          elif [[ -f "./ruoyi-modules/${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="./ruoyi-modules/${MODULE}/Dockerfile"
          elif [[ -f "./ruoyi-visual/${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="./ruoyi-visual/${MODULE}/Dockerfile"
          else
            echo "错误: 无法找到模块 ${MODULE} 的 Dockerfile"
            exit 1
          fi
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT

          # 确定模块目录
          if [[ "${MODULE}" == ruoyi-* && ! "${MODULE}" =~ ^ruoyi-modules/ && ! "${MODULE}" =~ ^ruoyi-visual/ ]]; then
            MODULE_DIR="./${MODULE}"
          elif [[ "${MODULE}" =~ ^ruoyi-modules/ ]]; then
            MODULE_DIR="./${MODULE}"
          elif [[ "${MODULE}" =~ ^ruoyi-visual/ ]]; then
            MODULE_DIR="./${MODULE}"
          elif [[ -d "./ruoyi-modules/${MODULE}" ]]; then
            MODULE_DIR="./ruoyi-modules/${MODULE}"
          elif [[ -d "./ruoyi-visual/${MODULE}" ]]; then
            MODULE_DIR="./ruoyi-visual/${MODULE}"
          else
            MODULE_DIR="./${MODULE}"
          fi
          echo "module_dir=${MODULE_DIR}" >> $GITHUB_OUTPUT

          # 准备JAR文件
          mkdir -p ${MODULE_DIR}/target/
          mkdir -p ./target/

          # 寻找JAR文件
          JAR_FILE=$(find artifacts/ -name "*${MODULE}*.jar" | head -n 1)
          if [ -z "${JAR_FILE}" ]; then
            echo "错误: 无法找到模块 ${MODULE} 的 JAR 文件"
            exit 1
          fi

          # 复制JAR文件到Dockerfile期望的位置
          cp ${JAR_FILE} ${MODULE_DIR}/target/${MODULE}.jar
          cp ${JAR_FILE} ./target/${MODULE}.jar

          echo "找到 JAR 文件: ${JAR_FILE}"
          echo "已复制到 ${MODULE_DIR}/target/${MODULE}.jar 和 ./target/${MODULE}.jar"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.build-params.outputs.dockerfile }}
          build-args: |
            MODULE=${{ matrix.module }}
            JAR_FILE=./target/${{ matrix.module }}.jar
          push: true
          tags: |
            ${{ steps.login-vars.outputs.image_prefix }}/${{ matrix.module }}:${{ github.ref_name }}
            ${{ steps.login-vars.outputs.image_prefix }}/${{ matrix.module }}:latest

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && (contains(github.ref, 'main') || contains(github.ref, 'master') || contains(github.ref, 'tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (contains(github.ref, 'tags/v') && 'prod' || 'dev') }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到开发环境
        if: github.event.inputs.environment == 'dev' || (!github.event.inputs.environment && !contains(github.ref, 'tags/v'))
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d

      - name: 部署到测试环境
        if: github.event.inputs.environment == 'test'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d

      - name: 部署到生产环境
        if: github.event.inputs.environment == 'prod' || contains(github.ref, 'tags/v')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d
