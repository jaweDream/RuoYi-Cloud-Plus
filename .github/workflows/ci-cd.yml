name: CI/CD Pipeline

on:
  push:
    branches: [ "dev-ops" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "dev-ops" ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      registry_type:
        description: '镜像仓库类型'
        required: false
        default: 'github'
        type: choice
        options:
          - github
          - dockerhub
          - custom
      custom_registry:
        description: '自定义镜像仓库URL'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: 构建与测试
        run: mvn -B package --file pom.xml -DskipTests=${{ github.event_name == 'push' && contains(github.ref, 'tags/v') && 'false' || 'true' }}

      - name: 缓存Maven包
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 打包制品
        if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "*/target/original-*.jar" -not -path "*/target/*-javadoc.jar" -not -path "*/target/*-sources.jar" -not -path "*/target/test-*" -not -path "*/target/classes" -not -path "*/target/maven-*" -exec cp {} artifacts/ \;

      - name: 上传构建制品
        if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          retention-days: 5

  docker:
    needs: build
    if: github.event_name == 'push' && contains(github.ref, 'dev-ops')
    uses: ./.github/workflows/build.yml
    with:
      module: 'tg-bot-cloud'
      image_name: 'tg-bot-cloud'
      image_tag: ${{ github.ref_name }}
      registry_type: ${{ github.event.inputs.registry_type || 'github' }}
      custom_registry: ${{ github.event.inputs.custom_registry }}
      dockerfile: './ruoyi-gateway/Dockerfile' # 使用一个存在的 Dockerfile 作为示例
    secrets:
      custom_username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
      custom_token: ${{ secrets.CUSTOM_REGISTRY_TOKEN }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && (contains(github.ref, 'main') || contains(github.ref, 'master') || contains(github.ref, 'tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (contains(github.ref, 'tags/v') && 'prod' || 'dev') }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到开发环境
        if: github.event.inputs.environment == 'dev' || (!github.event.inputs.environment && !contains(github.ref, 'tags/v'))
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d

      - name: 部署到测试环境
        if: github.event.inputs.environment == 'test'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d

      - name: 部署到生产环境
        if: github.event.inputs.environment == 'prod' || contains(github.ref, 'tags/v')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d
