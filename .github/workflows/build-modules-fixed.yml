name: Build Microservice Modules

on:
  push:
    branches: [ "dev-ops" ]
    paths:
      - 'ruoyi-**/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      modules:
        description: '要构建的模块（以逗号分隔，留空则构建所有模块）'
        required: false
        type: string
      image_tag:
        description: '镜像标签（留空则使用当前分支名或latest）'
        required: false
        type: string
      registry_type:
        description: '镜像仓库类型'
        required: false
        default: 'github'
        type: choice
        options:
          - github
          - dockerhub
          - custom
      custom_registry:
        description: '自定义镜像仓库URL'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置要构建的模块
        id: set-modules
        run: |
          if [ -z "${{ github.event.inputs.modules }}" ]; then
            # 默认模块列表
            MODULES='ruoyi-gateway,ruoyi-auth,ruoyi-system,ruoyi-gen,ruoyi-job,ruoyi-resource,ruoyi-workflow'
          else
            MODULES="${{ github.event.inputs.modules }}"
          fi
          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
          echo "将构建以下模块: ${MODULES}"

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven 构建
        run: mvn -B clean package -DskipTests

      - name: 显示构建结果
        run: find . -name "target" -type d -exec ls -la {} \;

      - name: 打包制品
        run: |
          mkdir -p artifacts
          echo "查找编译后的 JAR 文件..."
          find ./*/target/ -maxdepth 1 -name "*.jar" -not -name "original-*.jar" -not -name "*-javadoc.jar" -not -name "*-sources.jar" -not -name "test-*" -exec cp {} artifacts/ \;

          # 如果上述命令未找到文件，尝试更广泛的搜索
          if [ ! "$(ls -A artifacts)" ]; then
            echo "未找到标准位置的 JAR 文件，尝试更广泛的搜索..."
            find . -name "*.jar" -not -path "*/original-*.jar" -exec cp {} artifacts/ \;
          fi

          echo "检查 artifacts 目录内容:"
          ls -la artifacts/

      - name: 上传构建制品
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          retention-days: 5

  docker-build:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.prepare.outputs.modules)) }}
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备构建参数
        id: build-params
        run: |
          MODULE="${{ matrix.module }}"

          # 确定 Dockerfile 路径
          if [[ -f "./${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="./${MODULE}/Dockerfile"
          elif [[ -f "./ruoyi-modules/${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="./ruoyi-modules/${MODULE}/Dockerfile"
          elif [[ -f "./ruoyi-visual/${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="./ruoyi-visual/${MODULE}/Dockerfile"
          else
            echo "错误: 无法找到模块 ${MODULE} 的 Dockerfile"
            exit 1
          fi
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT

          # 确定模块目录
          if [[ "$MODULE" == ruoyi-* && ! "$MODULE" =~ ^ruoyi-modules/ && ! "$MODULE" =~ ^ruoyi-visual/ ]]; then
            MODULE_DIR="./${MODULE}"
          elif [[ "$MODULE" =~ ^ruoyi-modules/ ]]; then
            MODULE_DIR="./${MODULE}"
          elif [[ "$MODULE" =~ ^ruoyi-visual/ ]]; then
            MODULE_DIR="./${MODULE}"
          elif [[ -d "./ruoyi-modules/${MODULE}" ]]; then
            MODULE_DIR="./ruoyi-modules/${MODULE}"
          elif [[ -d "./ruoyi-visual/${MODULE}" ]]; then
            MODULE_DIR="./ruoyi-visual/${MODULE}"
          else
            MODULE_DIR="./${MODULE}"
          fi
          echo "module_dir=${MODULE_DIR}" >> $GITHUB_OUTPUT

          # 准备JAR文件
          mkdir -p ${MODULE_DIR}/target/
          mkdir -p ./target/

          # 寻找JAR文件
          JAR_FILE=$(find artifacts/ -name "*${MODULE}*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "错误: 无法找到模块 ${MODULE} 的 JAR 文件"
            exit 1
          fi

          # 复制JAR文件到目标位置
          cp ${JAR_FILE} ${MODULE_DIR}/target/${MODULE}.jar
          cp ${JAR_FILE} ./target/${MODULE}.jar

          echo "找到 JAR 文件: ${JAR_FILE}"
          echo "已复制到 ${MODULE_DIR}/target/${MODULE}.jar 和 ./target/${MODULE}.jar"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.build-params.outputs.dockerfile }}
          build-args: |
            MODULE=${{ matrix.module }}
            JAR_FILE=./target/${{ matrix.module }}.jar
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.module }}:${{ github.event.inputs.image_tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.module }}:latest
