name: 手动触发测试

on:
  workflow_dispatch:
    inputs:
      test_input:
        description: '测试输入参数'
        required: false
        default: '测试值'
        type: string

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 输出测试信息
        run: |
          echo "这是一个手动触发的测试工作流"
          echo "输入参数: ${{ github.event.inputs.test_input }}"
          echo "当前时间: $(date)"
          echo "当前分支: ${{ github.ref }}"
