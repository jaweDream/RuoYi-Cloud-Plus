name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      module:
        description: '模块名称'
        required: true
        type: string
      dockerfile:
        description: 'Dockerfile 路径'
        required: false
        type: string
        default: ''
      image_name:
        description: '镜像名称'
        required: false
        type: string
      image_tag:
        description: '镜像标签'
        required: false
        type: string
        default: 'latest'
      registry_type:
        description: '镜像仓库类型'
        required: false
        default: 'github'
        type: string
      custom_registry:
        description: '自定义镜像仓库URL'
        required: false
        type: string
      jar_file:
        description: 'JAR 文件路径'
        required: false
        type: string
        default: ''
    secrets:
      custom_username:
        required: false
      custom_token:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  login:
    uses: ./.github/workflows/docker-login.yml
    with:
      registry_type: ${{ inputs.registry_type }}
      custom_registry: ${{ inputs.custom_registry }}
    secrets:
      custom_username: ${{ secrets.custom_username }}
      custom_token: ${{ secrets.custom_token }}

  build-image:
    needs: login
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/

      - name: 设置构建参数
        id: build-params
        run: |
          # 确定 Dockerfile 路径
          if [ -n "${{ inputs.dockerfile }}" ]; then
            # 使用指定的 Dockerfile 路径
            DOCKERFILE="${{ inputs.dockerfile }}"
          else
            # 检查模块根目录下是否有 Dockerfile
            if [ -f "./${{ inputs.module }}/Dockerfile" ]; then
              DOCKERFILE="./${{ inputs.module }}/Dockerfile"
            # 检查 ruoyi-modules 子目录
            elif [ -f "./ruoyi-modules/${{ inputs.module }}/Dockerfile" ]; then
              DOCKERFILE="./ruoyi-modules/${{ inputs.module }}/Dockerfile"
            # 检查 ruoyi-visual 子目录
            elif [ -f "./ruoyi-visual/${{ inputs.module }}/Dockerfile" ]; then
              DOCKERFILE="./ruoyi-visual/${{ inputs.module }}/Dockerfile"
            else
              echo "错误: 无法找到模块 ${{ inputs.module }} 的 Dockerfile"
              echo "请检查以下路径:"
              echo "./${{ inputs.module }}/Dockerfile"
              echo "./ruoyi-modules/${{ inputs.module }}/Dockerfile"
              echo "./ruoyi-visual/${{ inputs.module }}/Dockerfile"
              echo "或者使用 dockerfile 参数指定路径"
              exit 1
            fi
          fi
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT
          echo "使用 Dockerfile: ${DOCKERFILE}"

          # 确定 JAR 文件路径
          if [ -n "${{ inputs.jar_file }}" ]; then
            JAR_FILE="${{ inputs.jar_file }}"
          else
            JAR_FILE="artifacts/${{ inputs.module }}.jar"

            # 检查 JAR 文件是否存在
            if [ ! -f "${JAR_FILE}" ]; then
              echo "警告: 未找到 ${JAR_FILE}"
              echo "列出 artifacts 目录内容:"
              ls -la artifacts/

              # 尝试查找匹配的 JAR 文件
              FOUND_JAR=$(find artifacts/ -name "*${{ inputs.module }}*.jar" | head -n 1)
              if [ -n "${FOUND_JAR}" ]; then
                JAR_FILE="${FOUND_JAR}"
                echo "找到匹配的 JAR 文件: ${JAR_FILE}"
              else
                echo "错误: 无法找到模块 ${{ inputs.module }} 的 JAR 文件"
                exit 1
              fi
            fi
          fi
          echo "jar_file=${JAR_FILE}" >> $GITHUB_OUTPUT
          echo "使用 JAR 文件: ${JAR_FILE}"

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.login.outputs.image_prefix }}/${{ inputs.image_name || format('tg-bot-cloud-{0}', inputs.module) }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.image_tag == '' || inputs.image_tag == 'latest' }}
            type=sha,format=short,prefix=
            type=ref,event=branch

      - name: 准备 JAR 文件
        run: |
          # 确定模块目录路径
          if [[ "${{ inputs.module }}" == ruoyi-* && ! "${{ inputs.module }}" =~ ^ruoyi-modules/ && ! "${{ inputs.module }}" =~ ^ruoyi-visual/ ]]; then
            MODULE_DIR="./${{ inputs.module }}"
          elif [[ "${{ inputs.module }}" =~ ^ruoyi-modules/ ]]; then
            MODULE_DIR="./${{ inputs.module }}"
          elif [[ "${{ inputs.module }}" =~ ^ruoyi-visual/ ]]; then
            MODULE_DIR="./${{ inputs.module }}"
          elif [[ -d "./ruoyi-modules/${{ inputs.module }}" ]]; then
            MODULE_DIR="./ruoyi-modules/${{ inputs.module }}"
          elif [[ -d "./ruoyi-visual/${{ inputs.module }}" ]]; then
            MODULE_DIR="./ruoyi-visual/${{ inputs.module }}"
          else
            MODULE_DIR="./${{ inputs.module }}"
          fi

          echo "模块目录: ${MODULE_DIR}"

          # 确保目标目录存在
          mkdir -p ${MODULE_DIR}/target/
          mkdir -p ./target/  # 同时创建根目录下的target目录

          # 将JAR文件复制到三个可能的位置，确保Docker能找到
          cp ${{ steps.build-params.outputs.jar_file }} ${MODULE_DIR}/target/${{ inputs.module }}.jar
          cp ${{ steps.build-params.outputs.jar_file }} ./target/${{ inputs.module }}.jar

          echo "检查JAR文件位置:"
          echo "${MODULE_DIR}/target/${{ inputs.module }}.jar:"
          ls -la ${MODULE_DIR}/target/
          echo "./target/${{ inputs.module }}.jar:"
          ls -la ./target/

          # 显示文件目录结构，帮助调试
          echo "显示工作目录结构:"
          find . -name "${{ inputs.module }}.jar" | sort

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.build-params.outputs.dockerfile }}
          build-args: |
            MODULE=${{ inputs.module }}
            JAR_FILE=./target/${{ inputs.module }}.jar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
