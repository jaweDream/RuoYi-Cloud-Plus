name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      module:
        description: '模块名称'
        required: true
        type: string
      dockerfile:
        description: 'Dockerfile 路径'
        required: false
        type: string
        default: './script/docker/Dockerfile'
      image_name:
        description: '镜像名称'
        required: false
        type: string
      image_tag:
        description: '镜像标签'
        required: false
        type: string
        default: 'latest'
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      registry_url:
        required: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.registry_url || 'docker.io' }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: 设置构建参数
        id: build_params
        run: |
          FULL_IMAGE_NAME="${{ secrets.registry_url != '' && format('{0}/', secrets.registry_url) || '' }}${{ secrets.registry_username }}/${{ inputs.image_name || format('tg-bot-cloud-{0}', inputs.module) }}"
          echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" >> $GITHUB_ENV
          echo "full_image_name=${FULL_IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.image_tag == '' || inputs.image_tag == 'latest' }}
            type=sha,format=short,prefix=
            type=ref,event=branch

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            MODULE=${{ inputs.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
