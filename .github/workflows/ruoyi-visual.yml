name: RuoYi 可视化中心服务模块构建

on:
  push:
    branches: [ "dev-ops" ]
    paths:
      - 'ruoyi-visual/**'
      - 'common/**'
      - 'pom.xml'
  pull_request:
    branches: [ "dev-ops" ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
      registry_type:
        description: '镜像仓库类型'
        required: false
        default: 'github'
        type: choice
        options:
          - github
          - dockerhub
          - custom
      custom_registry:
        description: '自定义镜像仓库URL'
        required: false
        type: string
      specific_module:
        description: '指定构建的模块(留空则构建所有模块)'
        required: false
        type: string
        default: ''
      skip_tests:
        description: '是否跳过测试'
        required: false
        type: boolean
        default: true
      image_tag:
        description: '镜像标签(留空使用latest)'
        required: false
        type: string
        default: 'latest'
      deploy_after_build:
        description: '构建后是否部署'
        required: false
        type: boolean
        default: true

# 明确设置权限
permissions:
  contents: read
  packages: write  # 允许推送到GHCR

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: 安装Maven
        run: |
          # 检查Maven是否已安装
          if ! command -v mvn &> /dev/null; then
            echo "正在安装Maven..."
            # 创建临时目录
            mkdir -p /tmp/maven_install
            cd /tmp/maven_install

            # 下载Maven
            curl -O https://dlcdn.apache.org/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz

            # 解压
            tar -xzf apache-maven-3.9.5-bin.tar.gz

            # 移动到本地位置
            mkdir -p $HOME/maven
            mv apache-maven-3.9.5/* $HOME/maven/

            # 添加到PATH（临时）
            export PATH=$HOME/maven/bin:$PATH

            # 清理
            cd $GITHUB_WORKSPACE
            rm -rf /tmp/maven_install

            echo "Maven已安装，版本："
            mvn --version
          else
            echo "Maven已存在，版本："
            mvn --version
          fi

          # 确保PATH在后续步骤中包含Maven
          echo "PATH=$HOME/maven/bin:$PATH" >> $GITHUB_ENV

      - name: 构建与测试
        run: |
          # 确保Maven在PATH中
          export PATH=$HOME/maven/bin:$PATH
          mvn -B package --file pom.xml -DskipTests=${{ github.event.inputs.skip_tests == 'true' }}

      - name: 缓存Maven包
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 打包制品
        if: github.event_name == 'push' && contains(github.ref, 'dev-ops') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "*/target/original-*.jar" -not -path "*/target/*-javadoc.jar" -not -path "*/target/*-sources.jar" -not -path "*/target/test-*" -not -path "*/target/classes" -not -path "*/target/maven-*" -exec cp {} artifacts/ \;

      - name: 上传构建制品
        if: github.event_name == 'push' && contains(github.ref, 'dev-ops') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: artifacts/
          retention-days: 5

  prepare-modules:
    runs-on: self-hosted
    if: github.event_name == 'push' && contains(github.ref, 'dev-ops') || github.event_name == 'workflow_dispatch'
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置要构建的模块
        id: set-modules
        run: |
          # 检查是否指定了特定模块
          if [ -n "${{ github.event.inputs.specific_module }}" ]; then
            # 检查指定模块是否存在
            SPECIFIC_MODULE="${{ github.event.inputs.specific_module }}"
            if [[ ! "$SPECIFIC_MODULE" =~ ^ruoyi-visual/ ]]; then
              SPECIFIC_MODULE="ruoyi-visual/${SPECIFIC_MODULE}"
            fi

            if [ -d "$SPECIFIC_MODULE" ] && [ -f "${SPECIFIC_MODULE}/pom.xml" ]; then
              echo "modules=[\"${SPECIFIC_MODULE}\"]" >> $GITHUB_OUTPUT
              echo "将构建指定模块: ${SPECIFIC_MODULE}"
              exit 0
            else
              echo "警告：指定的模块 ${SPECIFIC_MODULE} 不存在，将构建所有模块"
            fi
          fi

          # 检测ruoyi-visual目录下的所有可能的模块
          MODULES=()

          # 查找所有ruoyi-visual目录下的模块
          if [ -d "ruoyi-visual" ]; then
            for dir in ruoyi-visual/*/; do
              if [ -d "$dir" ]; then
                module_name=$(basename "$dir")
                # 检查是否存在pom.xml文件
                if [ -f "${dir}pom.xml" ]; then
                  MODULES+=("ruoyi-visual/${module_name}")
                fi
              fi
            done
          fi

          # 如果没有找到任何模块，设置一个默认值
          if [ ${#MODULES[@]} -eq 0 ]; then
            echo "没有找到任何visual模块，请检查目录结构"
            MODULES='["ruoyi-visual/ruoyi-monitor"]'
          else
            # 将数组转换为JSON格式
            MODULES_JSON="["
            for ((i=0; i<${#MODULES[@]}; i++)); do
              MODULES_JSON+="\"${MODULES[$i]}\""
              if [ $i -lt $((${#MODULES[@]}-1)) ]; then
                MODULES_JSON+=","
              fi
            done
            MODULES_JSON+="]"
            MODULES="$MODULES_JSON"
          fi

          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
          echo "将构建以下模块: ${MODULES}"

  docker-build:
    needs: [build, prepare-modules]
    if: github.event_name == 'push' && contains(github.ref, 'dev-ops') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    strategy:
      matrix:
        module: ${{ fromJSON(needs.prepare-modules.outputs.modules) }}
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: visual-artifacts
          path: artifacts/

      - name: 设置 Docker 登录信息
        id: login-vars
        run: |
          # 设置仓库类型变量
          if [ "${{ github.event.inputs.registry_type }}" == "github" ] || [ -z "${{ github.event.inputs.registry_type }}" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "registry_url=ghcr.io" >> $GITHUB_OUTPUT
            echo "image_prefix=ghcr.io/${OWNER}" >> $GITHUB_OUTPUT
            echo "username=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.registry_type }}" == "dockerhub" ]; then
            echo "registry_url=docker.io" >> $GITHUB_OUTPUT
            echo "image_prefix=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.DOCKERHUB_TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "registry_url=${{ github.event.inputs.custom_registry }}" >> $GITHUB_OUTPUT
            echo "image_prefix=${{ github.event.inputs.custom_registry }}/${{ secrets.CUSTOM_REGISTRY_USERNAME }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.CUSTOM_REGISTRY_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.CUSTOM_REGISTRY_TOKEN }}" >> $GITHUB_OUTPUT
          fi

          # 设置镜像标签
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "image_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 登录到 Docker 仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.login-vars.outputs.registry_url }}
          username: ${{ steps.login-vars.outputs.username }}
          password: ${{ steps.login-vars.outputs.password }}

      - name: 准备构建参数
        id: build-params
        run: |
          MODULE="${{ matrix.module }}"

          # 提取模块基本名称（去掉路径前缀）
          BASE_MODULE=$(basename "${MODULE}")
          echo "base_module=${BASE_MODULE}" >> $GITHUB_OUTPUT

          # 确定 Dockerfile 路径
          if [[ -f "${MODULE}/Dockerfile" ]]; then
            DOCKERFILE="${MODULE}/Dockerfile"
          else
            echo "错误: 无法找到模块 ${MODULE} 的 Dockerfile"
            exit 1
          fi
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT

          # 确定模块目录
          MODULE_DIR="${MODULE}"
          echo "module_dir=${MODULE_DIR}" >> $GITHUB_OUTPUT

          # 使用准备脚本
          bash .github/workflows/docker-prepare.sh "${BASE_MODULE}" "${MODULE_DIR}"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.build-params.outputs.dockerfile }}
          build-args: |
            MODULE=${{ steps.build-params.outputs.base_module }}
            JAR_FILE=./target/${{ steps.build-params.outputs.base_module }}.jar
          push: true
          tags: |
            ${{ steps.login-vars.outputs.image_prefix }}/${{ steps.build-params.outputs.base_module }}:${{ steps.login-vars.outputs.image_tag }}
            ${{ steps.login-vars.outputs.image_prefix }}/${{ steps.build-params.outputs.base_module }}:latest

  deploy:
    needs: docker-build
    if: (github.event_name == 'push' && contains(github.ref, 'dev-ops')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_after_build == 'true')
    runs-on: self-hosted
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到开发环境
        if: github.event.inputs.environment == 'dev' || !github.event.inputs.environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d

      - name: 部署到测试环境
        if: github.event.inputs.environment == 'test'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_PORT }}
          script: |
            cd /opt/tg-bot-cloud
            docker-compose pull
            docker-compose up -d
