name: Build Microservice Modules

on:
  push:
    branches: [ "dev-ops" ]
    paths:
      - 'ruoyi-**/**'  # 仅当微服务模块代码变更时触发
      - 'pom.xml'      # 或当 pom.xml 变更时触发
  workflow_dispatch:
    inputs:
      modules:
        description: '要构建的模块（以逗号分隔，留空则构建所有模块）'
        required: false
        type: string
      image_tag:
        description: '镜像标签（留空则使用当前分支名或latest）'
        required: false
        type: string
      registry_type:
        description: '镜像仓库类型'
        required: false
        default: 'github'
        type: choice
        options:
          - github
          - dockerhub
          - custom
      custom_registry:
        description: '自定义镜像仓库URL'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置要构建的模块
        id: set-modules
        run: |
          if [ -z "${{ github.event.inputs.modules }}" ]; then
            # 默认模块列表
            MODULES='ruoyi-gateway,ruoyi-auth,ruoyi-system,ruoyi-gen,ruoyi-job,ruoyi-resource,ruoyi-workflow'
          else
            MODULES="${{ github.event.inputs.modules }}"
          fi
          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
          echo "将构建以下模块: ${MODULES}"

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven 构建
        run: mvn -B clean package -DskipTests

      - name: 检查构建结果和目标目录内容...
        run: find . -name "target" -type d -exec ls -la {} \;

      - name: 打包制品
        run: |
          mkdir -p artifacts
          echo "查找编译后的 JAR 文件..."
          # 查找模块的主要 JAR 文件
          find ./*/target/ -maxdepth 1 -name "*.jar" -not -name "original-*.jar" -not -name "*-javadoc.jar" -not -name "*-sources.jar" -not -name "test-*" -exec ls -la {} \;

          # 复制所有主要 JAR 文件到 artifacts 目录
          echo "复制 JAR 文件到 artifacts 目录..."
          find ./*/target/ -maxdepth 1 -name "*.jar" -not -name "original-*.jar" -not -name "*-javadoc.jar" -not -name "*-sources.jar" -not -name "test-*" -exec cp {} artifacts/ \;

          # 如果上述命令未找到文件，尝试更广泛的搜索
          if [ ! "$(ls -A artifacts)" ]; then
            echo "未找到标准位置的 JAR 文件，尝试更广泛的搜索..."
            find . -name "*.jar" -not -path "*/original-*.jar" -exec cp {} artifacts/ \;
          fi

          echo "检查 artifacts 目录内容:"
          ls -la artifacts/

      - name: 检查构建制品
        run: |
          if [ ! "$(ls -A artifacts)" ]; then
            echo "错误：artifacts 目录为空，没有找到任何 JAR 文件！"
            echo "检查 Maven 构建步骤是否成功完成，以及模块路径是否正确。"
            exit 1
          else
            echo "找到以下 JAR 文件，准备上传："
            ls -la artifacts/
          fi

      - name: 上传构建制品
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          retention-days: 5

  docker-build:
    needs: [prepare, build]
    uses: ./.github/workflows/build.yml
    with:
      module: ${{ matrix.module }}
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      registry_type: ${{ inputs.registry_type || 'github' }}
      custom_registry: ${{ inputs.custom_registry }}
    secrets:
      custom_username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
      custom_token: ${{ secrets.CUSTOM_REGISTRY_TOKEN }}
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.prepare.outputs.modules)) }}
      fail-fast: false
