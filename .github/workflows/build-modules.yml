name: Build Microservice Modules

on:
  workflow_dispatch:
    inputs:
      modules:
        description: '要构建的模块（以逗号分隔，留空则构建所有模块）'
        required: false
        type: string
      image_tag:
        description: '镜像标签（留空则使用当前分支名或latest）'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置要构建的模块
        id: set-modules
        run: |
          if [ -z "${{ github.event.inputs.modules }}" ]; then
            # 默认模块列表
            MODULES='ruoyi-gateway,ruoyi-auth,ruoyi-system,ruoyi-gen,ruoyi-job,ruoyi-resource,ruoyi-workflow'
          else
            MODULES="${{ github.event.inputs.modules }}"
          fi
          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
          echo "将构建以下模块: ${MODULES}"

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven 构建
        run: mvn -B clean package -DskipTests

      - name: 打包制品
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "*/target/original-*.jar" -not -path "*/target/*-javadoc.jar" -not -path "*/target/*-sources.jar" -not -path "*/target/test-*" -not -path "*/target/classes" -not -path "*/target/maven-*" -exec cp {} artifacts/ \;

      - name: 上传构建制品
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          retention-days: 5

  docker-build:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.prepare.outputs.modules)) }}
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/

      - name: 设置模块变量
        id: set-vars
        run: |
          MODULE_NAME="${{ matrix.module }}"
          echo "module_name=${MODULE_NAME}" >> $GITHUB_OUTPUT
          echo "正在构建模块: ${MODULE_NAME}"

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 提取镜像标签
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            TAG="latest"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "使用镜像标签: ${TAG}"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./script/docker/Dockerfile
          build-args: |
            MODULE=${{ steps.set-vars.outputs.module_name }}
            JAR_FILE=artifacts/${{ steps.set-vars.outputs.module_name }}.jar
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.set-vars.outputs.module_name }}:${{ steps.tags.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.set-vars.outputs.module_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
