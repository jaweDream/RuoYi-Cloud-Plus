name: Build Microservice Modules

on:
  workflow_dispatch:
    inputs:
      modules:
        description: '要构建的模块（以逗号分隔，留空则构建所有模块）'
        required: false
        type: string
      image_tag:
        description: '镜像标签（留空则使用当前分支名或latest）'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置要构建的模块
        id: set-modules
        run: |
          if [ -z "${{ github.event.inputs.modules }}" ]; then
            # 默认模块列表
            MODULES='ruoyi-gateway,ruoyi-auth,ruoyi-system,ruoyi-gen,ruoyi-job,ruoyi-resource,ruoyi-workflow'
          else
            MODULES="${{ github.event.inputs.modules }}"
          fi
          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
          echo "将构建以下模块: ${MODULES}"

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven 构建
        run: |
          mvn -B clean package -DskipTests
          echo "检查构建结果和目标目录内容..."
          find . -name "target" -type d -exec ls -la {} \;

      - name: 打包制品
        run: |
          mkdir -p artifacts
          echo "查找编译后的 JAR 文件..."
          # 查找模块的主要 JAR 文件
          find ./*/target/ -maxdepth 1 -name "*.jar" -not -name "original-*.jar" -not -name "*-javadoc.jar" -not -name "*-sources.jar" -not -name "test-*" -exec ls -la {} \;

          # 复制所有主要 JAR 文件到 artifacts 目录
          echo "复制 JAR 文件到 artifacts 目录..."
          find ./*/target/ -maxdepth 1 -name "*.jar" -not -name "original-*.jar" -not -name "*-javadoc.jar" -not -name "*-sources.jar" -not -name "test-*" -exec cp {} artifacts/ \;

          # 如果上述命令未找到文件，尝试更广泛的搜索
          if [ ! "$(ls -A artifacts)" ]; then
            echo "未找到标准位置的 JAR 文件，尝试更广泛的搜索..."
            find . -name "*.jar" -not -path "*/original-*.jar" -exec cp {} artifacts/ \;
          fi

          echo "检查 artifacts 目录内容:"
          ls -la artifacts/

      - name: 检查构建制品
        run: |
          if [ ! "$(ls -A artifacts)" ]; then
            echo "错误：artifacts 目录为空，没有找到任何 JAR 文件！"
            echo "检查 Maven 构建步骤是否成功完成，以及模块路径是否正确。"
            exit 1
          else
            echo "找到以下 JAR 文件，准备上传："
            ls -la artifacts/
          fi

      - name: 上传构建制品
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          retention-days: 5

  docker-build:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.prepare.outputs.modules)) }}
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/

      - name: 设置模块变量
        id: set-vars
        run: |
          MODULE_NAME="${{ matrix.module }}"
          echo "module_name=${MODULE_NAME}" >> $GITHUB_OUTPUT
          echo "正在构建模块: ${MODULE_NAME}"

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 提取镜像标签
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            TAG="latest"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "使用镜像标签: ${TAG}"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./script/docker/Dockerfile
          build-args: |
            MODULE=${{ steps.set-vars.outputs.module_name }}
            JAR_FILE=artifacts/${{ steps.set-vars.outputs.module_name }}.jar
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.set-vars.outputs.module_name }}:${{ steps.tags.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.set-vars.outputs.module_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
